# quality-loop — Configuration par défaut
# Modifie ces valeurs pour ajuster le comportement sans toucher au script

# Seuil de passage (0-10)
threshold: 8

# Nombre max de rounds avant arrêt forcé
max_rounds: 5

# Répertoire des critères
criteria_dir: ~/.hermes/skills/quality-loop/criteria

# Répertoire des templates
prompts_dir: ~/.hermes/skills/quality-loop/prompts

# Template juge par défaut
judge_prompt_template: judge_default

# Fichier de log des rounds
log_file: ~/.hermes/quality-loop-logs.jsonl

# Modèle pour le juge (laisser vide = modèle par défaut)
judge_model: ""

# Feedback injecté automatiquement au round suivant ?
inject_feedback: true